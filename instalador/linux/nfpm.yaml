name: "anvilore"
arch: "all"
platform: "linux"
version: "${ANVILORE_VERSAO}"
section: "utils"
priority: "optional"
maintainer: "Iago Frota <iagofrota10@gmail.com>"
description: "Kit de wiki curada por agente"
vendor: "Anvilore"
homepage: "https://github.com/iagofrota/anvilore"
license: "MIT"
contents:
  - src: ./instalador/anvilore-abrir
    dst: /usr/lib/anvilore/anvilore-abrir
    file_info:
      mode: 0755
  - src: "${ANVILORE_INSTALAR_SH}"
    dst: /usr/lib/anvilore/instalar.sh
    file_info:
      mode: 0755
  - src: /usr/lib/anvilore/anvilore-abrir
    dst: /usr/bin/anvilore-abrir
    type: symlink
  - src: ./instalador/linux/anvilore.desktop
    dst: /usr/share/applications/anvilore.desktop
    file_info:
      mode: 0644
  - src: ./instalador/anvilore.svg
    dst: /usr/share/icons/hicolor/scalable/apps/anvilore.svg
    file_info:
      mode: 0644
scripts:
  postinstall: ./instalador/linux/pos-instalacao.sh
  postremove: ./instalador/linux/pos-remocao.sh
depends:
  - git
  - unzip
  - curl
  - ca-certificates
recommends:
  - ripgrep
# O ssh-keygen pertence a openssh no Fedora (não a openssh-clients).
# Overrides repetem a lista: nfpm substitui depends em vez de somar.
overrides:
  deb:
    depends:
      - git
      - unzip
      - curl
      - ca-certificates
      - openssh-client
  rpm:
    depends:
      - git
      - unzip
      - curl
      - ca-certificates
      - openssh
