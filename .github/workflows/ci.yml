name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tipos, testes e cobertura (limite 0.8 em bunfig.toml)
        run: bun run checar
      - name: Checar a release (só em tag de versão)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bun src/cli.ts checar-release "${GITHUB_REF_NAME#v}"
