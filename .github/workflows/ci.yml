name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pacotes-linux:
    name: pacotes Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Regressões e build de produção (rede obrigatória)
        run: bun test tests/empacotar-linux.test.ts tests/empacotar-linux-regressoes.test.ts
      - name: Conferir scripts Linux
        run: shellcheck -S warning scripts/empacotar-linux.sh scripts/provar-pacotes-linux.sh scripts/provar-pacote-linux-container.sh instalador/linux/pos-instalacao.sh instalador/linux/pos-remocao.sh
      - name: Instalar em sistema limpo, abrir em duas contas e remover preservando dados
        shell: bash
        run: bash scripts/provar-pacotes-linux.sh '${{ matrix.distro }}' 2>&1 | tee pacotes-linux-${{ matrix.distro }}.log
      - name: Guardar evidência do runtime (pacotes com chave de teste nunca são publicados)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prova-pacotes-linux-${{ matrix.distro }}
          path: pacotes-linux-${{ matrix.distro }}.log
          retention-days: 7

  builds-release:
    name: Builds de produção da distribuição
    permissions:
      contents: read
    uses: ./.github/workflows/builds-release.yml

  testes:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Registrar PATH original e preparar rg temporário só para a prova
        if: always()
        run: bun scripts/rg-temporario-prova.ts
      - name: Tipos, testes e cobertura (limite 0.8 em bunfig.toml)
        run: bun run checar
      - name: Conferir assets versionados da interface
        run: git diff --exit-code -- src/ui/public
      - name: Checar links e referências da knowledge base
        run: bun src/cli.ts checar-docs
      - name: Medir links de diretório e arquivo (imprime resultado por sistema)
        if: always()
        run: bun scripts/medir-ligacoes.ts
      - name: Diagnosticar busca da skill query nos shells reais (obtido × esperado)
        if: always()
        run: bun scripts/provar-busca.ts
      - name: Provar fallback nativo de busca com acentos e espaços no caminho
        if: always()
        run: bun scripts/provar-busca-fallback.ts
      - name: Medir latência do hook proteger-raw (20 execuções; imprime mediana e p95 por sistema)
        if: always()
        run: bun scripts/medir-latencia-hook.ts
      - name: Provar a forma instalada do hook no shell real (raw bloqueia, wiki libera, sem bun não libera)
        if: always()
        env:
          ANVILORE_EXIGIR_SHELLS: "1"
        run: bun scripts/provar-forma-instalada.ts
      - name: Checar a release (em qualquer tag; o v da frente é opcional)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bun src/cli.ts checar-release "${GITHUB_REF_NAME#v}"
      - name: Remover rg temporário da prova
        if: always()
        run: bun scripts/rg-temporario-prova.ts --limpar

  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      instalar-ps1: ${{ steps.filtro.outputs.instalar-ps1 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filtro
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            instalar-ps1:
              - 'instalador/**'
              - 'tests/instalar-ps1/**'
              - 'seguranca/**'
              - '.github/workflows/ci.yml'

  instalar-ps1:
    name: instalar.ps1 (Windows, perfil vazio)
    needs: mudancas
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Ignorar instalar.ps1 (PR não altera arquivos do instalador)
        if: github.event_name == 'pull_request' && needs.mudancas.outputs.instalar-ps1 != 'true'
        shell: bash
        run: echo "PR não altera instalador/**, tests/instalar-ps1/**, seguranca/** ou ci.yml. Etapa pulada com sucesso."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name != 'pull_request' || needs.mudancas.outputs.instalar-ps1 == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name != 'pull_request' || needs.mudancas.outputs.instalar-ps1 == 'true'
        with:
          bun-version-file: package.json
      - name: Instalar Pester 5
        if: github.event_name != 'pull_request' || needs.mudancas.outputs.instalar-ps1 == 'true'
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Testes unitários do instalar.ps1 (Windows PowerShell 5.1)
        if: github.event_name != 'pull_request' || needs.mudancas.outputs.instalar-ps1 == 'true'
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/instalar-ps1/instalar.Tests.ps1'
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c
      - name: Resultados e pausa do AnviloreSetup.exe (runtime Inno e PowerShell)
        if: (github.event_name != 'pull_request' || needs.mudancas.outputs.instalar-ps1 == 'true') && !cancelled()
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/instalar-ps1/setup.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Prova de ponta a ponta do instalar.ps1 (perfil vazio, tag assinada com chave descartável)
        if: (github.event_name != 'pull_request' || needs.mudancas.outputs.instalar-ps1 == 'true') && !cancelled()
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/instalar-ps1/e2e.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  e2e-chromium:
    name: Playwright Chromium (${{ matrix.execucao }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        execucao: [1, 2, 3, 4, 5]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
      - name: Conferir Node do runner
        run: node --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Instalar Chromium e dependências do sistema
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Executar suíte Playwright sem retries
        run: bun run e2e
      - name: Conferir assets versionados da interface
        run: git diff --exit-code -- src/ui/public
      - name: Guardar relatório e traces da falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-falha-${{ matrix.execucao }}
          path: e2e/resultados/
          retention-days: 7
