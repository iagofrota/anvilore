name: release

# Primeira etapa U5: somente gates independentes. Builds e rascunho entram após integrar U7/U9.
on:
  push:
    tags: ["*"]

permissions:
  contents: read

env:
  TAG_ANTERIOR: v0.3.0
  # Âncora aprovada para a 0.3.1. Pin do objeto da tag já publicada, não da candidata.
  OBJETO_ANTERIOR: 820e143a3b555898e7c4ab498a7e702600ebfcd2
  COMMIT_ANTERIOR: 19578a1e6f3570975137488cd03ea0537e8c6a0e

jobs:
  assinatura:
    name: Tag e assinaturas offline dos instaladores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Autenticar a tag antes de executar código da candidata
        id: autenticar-tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$TAG_ANTERIOR")" = "$OBJETO_ANTERIOR"
          test "$(git rev-parse "refs/tags/$TAG_ANTERIOR^{commit}")" = "$COMMIT_ANTERIOR"
          git show "$COMMIT_ANTERIOR:seguranca/assinantes" > "$RUNNER_TEMP/assinantes-anteriores"
          git -c gpg.format=ssh -c gpg.ssh.program=ssh-keygen \
            -c gpg.program=false -c gpg.openpgp.program=false -c gpg.x509.program=false \
            -c "gpg.ssh.allowedSignersFile=$RUNNER_TEMP/assinantes-anteriores" \
            verify-tag "refs/tags/$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Conferir identidade, revogação e assinaturas públicas no commit autenticado
        shell: bash
        run: bun scripts/verificar-tag-release.ts "$GITHUB_REF_NAME" "$TAG_ANTERIOR"
      - name: Conferir revisão humana da documentação e notas da versão
        shell: bash
        run: bun src/cli.ts checar-release "${GITHUB_REF_NAME#v}"

  dependencias:
    name: SHA-256 de cada download do manifesto
    needs: assinatura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun scripts/verificar-dependencias-release.ts

  instalar-linux:
    name: Instalar e reinstalar em Linux x64 e arm64
    needs: assinatura
    permissions:
      contents: read
    uses: ./.github/workflows/instalar-linux.yml

  atualizar:
    name: Preservação, migração e reversão (${{ matrix.os }})
    needs: assinatura
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Atualização com Git real, origem local e chaves descartáveis (inclui R1-R5)
        run: bun test tests/atualizar.test.ts tests/atualizar-isolamento-git.test.ts tests/migrar-rastreio.test.ts
